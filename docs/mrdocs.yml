# $schema: https://mrdocs.com/docs/mrdocs/develop/_attachments/mrdocs.schema.json
# yaml-language-server: $schema=https://mrdocs.com/docs/mrdocs/develop/_attachments/mrdocs.schema.json

---
# `make mrdocs` runs MrDocs over a copy of include/ filtered through
# specgen-doxygen.sed and specgen-mrdocs.sed, which turn the headers' specgen
# wording markup into documentation MrDocs reads. The copy is in .build/.
source-root: ../.build/mrdocs
input:
  - ../.build/mrdocs/include
exclude:
  - ../.build/mrdocs/include/beman/movable_box/detail
exclude-patterns:
  - ../.build/mrdocs/include/beman/movable_box/detail/**
includes:
  - ../.build/mrdocs/include
file-patterns:
  - '*.hpp'
include-symbols:
  - 'beman::movable_box::**'
implementation-defined:
  - 'beman::movable_box::detail'
# The wording has no brief, and MrDocs would otherwise take the first
# paragraph out of the first section to make one.
auto-brief: false
multipage: true
generator: adoc
output: adoc
